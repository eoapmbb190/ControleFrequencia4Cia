<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #1f2937;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .hero {
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            max-width: 700px;
            margin-bottom: 30px;
        }

        .botao {
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .botao:hover {
            background: #1d4ed8;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h2>MEU SITE</h2>
    </header>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Serviços</a>
        <a href="#">Contato</a>
    </nav>

    <section class="hero">
        <h1>Bem-vindo!</h1>

        <p>
            Este é o meu primeiro site criado com HTML e hospedado pelo GitHub.
        </p>

        <a href="#" class="botao">Saiba mais</a>
    </section>

    <footer>
        <p>© 2026 - Meu Site</p>
    </footer>

</body>
</html>
